<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>{% block titulo %}Inventario Casa Töhö{% endblock %}</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css')}}">
  <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.ico')}}" type="image/x-icon">
</head>

<body>
{% block cuerpo %}{% endblock %}

  {# Aviso que se oculta solo (animación CSS, sin JavaScript) #}
  {% if mensaje %}<div class="toast" role="status">{{ mensaje }}</div>{% endif %}

  {# El JavaScript solo se encarga de detalles visuales (enviar filtros al cambiar un selector) #}
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>

</html>
